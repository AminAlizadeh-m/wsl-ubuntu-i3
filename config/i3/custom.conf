# Your own i3 settings. This file is loaded last, so it can override anything
# in ~/.config/i3/config, and wsl-ubuntu-i3's scripts never overwrite it.
# After editing, press Alt+Shift+c to reload i3.
#
# You can add new shortcuts here, but not reuse a key the main config already
# binds: i3 refuses duplicate key bindings.
#
# Examples:
#   gaps inner 0                                   # no gaps between windows
#   bindsym $mod+b exec --no-startup-id firefox    # Alt+b opens Firefox
#   workspace_auto_back_and_forth yes              # Alt+N twice goes back
