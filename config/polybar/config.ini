;==============================================================================
; polybar config for i3 (standalone, works with plain/classic i3)
;
; Install:
;   mkdir -p ~/.config/polybar
;   cp config.ini launch.sh ~/.config/polybar/
;   chmod +x ~/.config/polybar/launch.sh
; Then in ~/.config/i3/config: delete (or comment out) the whole "bar { ... }"
; block, add the line below, and restart i3 with Mod+Shift+r:
;   exec_always --no-startup-id ~/.config/polybar/launch.sh
;
; Modules that don't apply to your machine (no battery, no Wi-Fi) switch
; themselves off. Docs: https://github.com/polybar/polybar/wiki
;==============================================================================

[colors]
background     = #1e1e2e
background-alt = #313244
foreground     = #cdd6f4
muted          = #6c7086
accent         = #89b4fa
alert          = #f38ba8

;------------------------------------------------------------------------------
[bar/main]
; launch.sh sets MONITOR so every monitor gets its own bar
monitor = ${env:MONITOR:}
width = 100%
height = 26
background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
padding-right = 1
module-margin = 1
separator = |
separator-foreground = ${colors.muted}

font-0 = monospace:size=10;2

modules-left  = i3 xwindow
modules-right = pulseaudio memory cpu filesystem wlan eth battery date systray

cursor-click = pointer
enable-ipc = true

;------------------------------------------------------------------------------
[module/i3]
type = internal/i3
; only show the workspaces of the monitor this bar is on
pin-workspaces = true
index-sort = true
enable-scroll = false

format = <label-state> <label-mode>

label-mode = %mode%
label-mode-padding = 1
label-mode-background = ${colors.alert}
label-mode-foreground = ${colors.background}

label-focused = %name%
label-focused-padding = 1
label-focused-background = ${colors.background-alt}
label-focused-underline = ${colors.accent}

label-unfocused = %name%
label-unfocused-padding = 1
label-unfocused-foreground = ${colors.muted}

label-visible = %name%
label-visible-padding = 1
label-visible-underline = ${colors.muted}

label-urgent = %name%
label-urgent-padding = 1
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.background}

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

;------------------------------------------------------------------------------
[module/pulseaudio]
; also works with PipeWire (Ubuntu's default sound server)
type = internal/pulseaudio
format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.accent}
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = VOL muted
label-muted-foreground = ${colors.muted}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.accent}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.accent}
label = %percentage:2%%

[module/filesystem]
type = internal/fs
interval = 30
mount-0 = /
format-mounted-prefix = "DISK "
format-mounted-prefix-foreground = ${colors.accent}
label-mounted = %percentage_used%%

;------------------------------------------------------------------------------
[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
; show nothing while an interface is down
format-disconnected =

[module/wlan]
inherit = network-base
interface-type = wireless
format-connected-prefix = "WIFI "
format-connected-prefix-foreground = ${colors.accent}
label-connected = %essid% %local_ip%

[module/eth]
inherit = network-base
interface-type = wired
format-connected-prefix = "ETH "
format-connected-prefix-foreground = ${colors.accent}
label-connected = %local_ip%

;------------------------------------------------------------------------------
[module/battery]
type = internal/battery
; check yours with: ls /sys/class/power_supply
battery = BAT0
adapter = AC
full-at = 99
low-at = 15
poll-interval = 5

format-charging-prefix = "CHG "
format-charging-prefix-foreground = ${colors.accent}
format-charging = <label-charging>
label-charging = %percentage%%

format-discharging-prefix = "BAT "
format-discharging-prefix-foreground = ${colors.accent}
format-discharging = <label-discharging>
label-discharging = %percentage%%

format-low-prefix = "BAT "
format-low-prefix-foreground = ${colors.alert}
format-low = <label-low>
label-low = %percentage%% low
label-low-foreground = ${colors.alert}

label-full = BAT full

;------------------------------------------------------------------------------
[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
; click the clock to switch to the alternative format
date-alt = %Y-%m-%d
time-alt = %H:%M:%S
label = %date%  %time%

[module/systray]
; app icons (network, Telegram, ...); only shown on the first bar
type = internal/tray
tray-spacing = 6pt

;------------------------------------------------------------------------------
[settings]
screenchange-reload = true
